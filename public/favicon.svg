<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>TransitForge</title>
  <!-- A route bullet: three lines meeting at one interchange, in the M1 blue,
       the glyph set in white the way every bullet in the app is set. -->

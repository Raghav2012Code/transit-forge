  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M16 16V5.8"/>
    <path d="M16 16 7.4 20.6"/>
    <path d="M16 16l8.6 4.6"/>
  </g>
  <g fill="#ffffff">
    <circle cx="16" cy="5.8" r="2.5"/>
    <circle cx="7.4" cy="20.6" r="2.5"/>
    <circle cx="24.6" cy="20.6" r="2.5"/>
    <circle cx="16" cy="16" r="3.3"/>
  </g>
</svg>
